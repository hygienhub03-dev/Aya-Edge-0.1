[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aya-edge"
version = "0.1.0"
description = "Experimental compact sparse MoE language model scaffold"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jsonschema>=4.21"]
data = [
    "datasets>=2.19,<4",
    "huggingface_hub>=0.23",
    "pyarrow>=15",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "tokenizers>=0.19",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["aya_edge*"]
