schema_version: 1
review_date: '2026-11-07'
review_method: >-
  Official Hugging Face dataset cards/APIs and pinned repository files, Wikimedia dump/legal/format documentation,
  and official Berkeley/Gorilla BFCL sources were reviewed. Dataset payload files were not acquired. See docs/data/DATASET_LICENSING.md.
sources:
  - source_id: fineweb
    dataset_name: FineWeb
    repository: HuggingFaceFW/fineweb
    revision: 9bb295ddab0e05d785b879661af7260fed5140fc
    revision_kind: huggingface_commit
    configuration: sample-10BT
    split: train
    source_url: https://huggingface.co/datasets/HuggingFaceFW/fineweb
    license_name: ODC-By 1.0 plus Common Crawl Terms of Use
    license_url: https://opendatacommons.org/licenses/by/1-0/
    license_verified: true
    commercial_use: Dataset/database rights permit commercial use subject to terms; page-level rights are not established.
    redistribution: Conditional on ODC-By attribution/notices for the database and on separate rights in each page.
    attribution_required: true
    share_alike: false
    additional_restrictions:
      - Common Crawl terms defer to source-owner rights and require users to assess content legality.
      - ODC-By does not grant independent rights in webpage contents.
      - No comprehensive per-row content license manifest is published.
    upstream_sources:
      - Common Crawl web pages
      - Datatrove extraction, filtering, and deduplication pipeline
    synthetic_or_human: human-authored web content; not documented as synthetic
    known_limitations:
      - Dataset card narrative and current repository API disagree on crawl dates and corpus inventory.
      - Dataset-level ODC-By does not clear copyright, privacy, or publicity rights in individual pages.
    approval_status: blocked_pending_review
    review_notes: >-
      Small streaming sample only is proposed. Do not acquire until page-level rights, intended commercial use,
      and source-owner terms are reviewed; validate selected revision/config inventory before acquisition.
    review_evidence:
      - https://huggingface.co/datasets/HuggingFaceFW/fineweb/raw/9bb295ddab0e05d785b879661af7260fed5140fc/README.md
      - https://commoncrawl.org/terms-of-use
      - https://opendatacommons.org/licenses/by/1-0/
    use_class: stage1
    normalizer:
      kind: document
      text_field: text
      title_field: url
      id_field: id

