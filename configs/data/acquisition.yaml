schema_version: 1
source_registry: configs/data/source_registry.yaml
stage: pilot
cache_dir: ${HF_HOME}
storage:
  raw_root: ${AYA_DATA_ROOT}/raw
  processed_root: ${AYA_DATA_ROOT}/processed
  resume: true
  checksum_algorithm: sha256
  max_materialized_records_per_source: 250
  streaming: true
